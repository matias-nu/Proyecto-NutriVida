<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Agenda tu hora | NutriVida</title>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">NutriVida</a>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Agenda tu hora</h1>
            <p>
                Completa el formulario y nuestra secretaría confirmará el
                horario disponible según el profesional que elijas.
            </p>
        </section>

        <section>
            <form id="form-agenda" novalidate>

                <p id="confirmacion-agenda" role="status"></p>

                <div>
                    <label for="nombre">Nombre completo</label><br>
                    <input type="text" id="nombre" name="nombre">
                    <small id="error-nombre" class="error"></small>
                </div>

                <div>
                    <label for="correo">Correo electrónico</label><br>
                    <input type="email" id="correo" name="correo">
                    <small id="error-correo" class="error"></small>
                </div>

                <div>
                    <label for="telefono">Teléfono de contacto</label><br>
                    <input type="tel" id="telefono" name="telefono">
                    <small id="error-telefono" class="error"></small>
                </div>

                <div>
                    <label for="nutricionista">Nutricionista preferido</label><br>
                    <select id="nutricionista" name="nutricionista">
                        <option value="">Selecciona un profesional</option>
                        <option value="carolina">Carolina Fuentes M.</option>
                        <option value="rodrigo">Rodrigo Sepúlveda A.</option>
                        <option value="daniela">Daniela Morales C.</option>
                        <option value="felipe">Felipe Araya R.</option>
                    </select>
                    <small id="error-nutricionista" class="error"></small>
                </div>

                <div>
                    <label for="fecha">Fecha preferida</label><br>
                    <input type="date" id="fecha" name="fecha">
                    <small id="error-fecha" class="error"></small>
                </div>

                <div>
                    <label for="motivo">Motivo de la consulta</label><br>
                    <textarea id="motivo" name="motivo"></textarea>
                    <small id="error-motivo" class="error"></small>
                </div>

                <button type="submit">Solicitar hora</button>
                <button type="reset">Limpiar formulario</button>
            </form>
        </section>
    </main>

    <footer>
        <p>2026 NutriVida. Todos los derechos reservados.</p>
        <nav>
            <a href="contacto.html">Contacto</a>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </nav>
    </footer>

    <script src="Script.js" defer></script>
</body>
</html>
